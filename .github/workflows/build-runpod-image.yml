name: Build & Push TRELLIS.2 RunPod Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to push
        required: false
        default: latest
      trellis2_repo:
        description: TRELLIS.2 git repository URL
        required: false
        default: https://github.com/AmrNabil12/TRELLIS.2.git
      trellis2_branch:
        description: TRELLIS.2 git branch or tag
        required: false
        default: main

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space on GitHub runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost
          df -h

      - name: Set lowercase image name
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${{ env.REGISTRY }}/${OWNER}/trellis2-runpod:${{ inputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push RunPod Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./runpod
          file: ./runpod/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image }}
          build-args: |
            MAX_JOBS=2
            TRELLIS2_REPO=${{ inputs.trellis2_repo }}
            TRELLIS2_BRANCH=${{ inputs.trellis2_branch }}
